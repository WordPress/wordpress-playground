<!doctype html>
<html>
	<head>
		<title>WordPress request transport</title>
	</head>
	<body>
		<script type="module">
			import bridgeScriptUrl from './src/lib/wordpress-bridge.ts?worker&url';
			// Share the same bundle with the service worker's offline helper document.
			// Vite extracts this inline module into an external script. Before serving
			// the built HTML on the WordPress host, the server must rewrite its script
			// and preload URLs to the app origin. import.meta.url then points to the
			// app host, so the bridge bundle below also loads there on the first visit,
			// before a WordPress service worker exists to generate the helper HTML.
			const script = document.createElement('script');
			script.type = 'module';
			script.src = new URL(bridgeScriptUrl, import.meta.url).href;
			document.head.append(script);
		</script>
	</body>
</html>
