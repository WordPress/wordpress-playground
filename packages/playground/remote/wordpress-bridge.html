<!doctype html>
<html>
	<head>
		<title>WordPress request transport</title>
	</head>
	<body>
		<script type="module">
			import bridgeScriptUrl from './src/lib/wordpress-bridge.ts?worker&url';
			import { resolveAssetUrl } from './src/lib/config';
			// Share the same bundle with the service worker's offline helper document.
			// Vite extracts this inline module into an external script. Resolve its
			// root-relative worker URL inside the immutable release too, so the bridge
			// can find release metadata before installing the sandbox worker.
			const script = document.createElement('script');
			script.type = 'module';
			script.src = resolveAssetUrl(bridgeScriptUrl).href;
			document.head.append(script);
		</script>
	</body>
</html>
