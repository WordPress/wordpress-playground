<!doctype html>
<html>
	<head>
		<title>WordPress Playground</title>
		<style>
			html,
			body,
			iframe {
				width: 100%;
				height: 100%;
				margin: 0;
				border: 0;
			}
			iframe {
				display: block;
			}
		</style>
	</head>
	<body>
		<iframe
			id="wp"
			name="wordpress-popup"
			title="The WordPress site"
			sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals"
		></iframe>
		<script type="module">
			import { bootWordPressPopup } from '/src/lib/wordpress-popup';
			bootWordPressPopup();
		</script>
	</body>
</html>
