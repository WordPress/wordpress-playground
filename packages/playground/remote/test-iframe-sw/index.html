<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Iframe Service Worker Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.pending { background: #fff3cd; color: #856404; }

        .test-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        h2 { margin-top: 0; }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #0056b3; }

        #log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
            border-radius: 4px;
        }
        .log-entry { margin: 2px 0; }
        .log-entry.info { color: #6a9955; }
        .log-entry.warn { color: #dcdcaa; }
        .log-entry.error { color: #f48771; }
    </style>
</head>
<body>
    <h1>Iframe Service Worker Control Test</h1>

    <div id="sw-status" class="status pending">Service Worker: Checking...</div>

    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="createSrcdocIframe()">Create srcdoc iframe</button>
        <button onclick="createAboutBlankIframe()">Create about:blank iframe</button>
        <button onclick="createBlobIframe()">Create blob: iframe</button>
        <button onclick="createNestedIframes()">Create nested iframes (3 levels)</button>
        <button onclick="createTinyMCEIframe()">Create TinyMCE iframe</button>
        <button onclick="clearTests()">Clear All</button>
    </div>

    <div class="test-section">
        <h2>Console Log</h2>
        <div id="log"></div>
    </div>

    <div class="test-section">
        <h2>Test Area</h2>
        <div id="test-area"></div>
    </div>

    <script>
        // Custom console log that shows in the page
        const logDiv = document.getElementById('log');
        const originalConsole = { log: console.log, warn: console.warn, error: console.error };

        function addLog(type, consoleMethod, ...args) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${type.toUpperCase()}] ${args.map(a =>
                typeof a === 'object' ? JSON.stringify(a) : String(a)
            ).join(' ')}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            consoleMethod.apply(console, args);
        }

        console.log = (...args) => addLog('info', originalConsole.log, ...args);
        console.warn = (...args) => addLog('warn', originalConsole.warn, ...args);
        console.error = (...args) => addLog('error', originalConsole.error, ...args);

        // Register service worker
        async function registerServiceWorker() {
            const statusDiv = document.getElementById('sw-status');

            if (!('serviceWorker' in navigator)) {
                statusDiv.textContent = 'Service Worker: Not supported';
                statusDiv.className = 'status error';
                return;
            }

            try {
                const registration = await navigator.serviceWorker.register('./sw.js');
                console.log('Service Worker registered:', registration.scope);

                // Wait for the service worker to be active
                if (registration.active) {
                    statusDiv.textContent = 'Service Worker: Active';
                    statusDiv.className = 'status success';
                } else {
                    statusDiv.textContent = 'Service Worker: Installing...';
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'activated') {
                                statusDiv.textContent = 'Service Worker: Active';
                                statusDiv.className = 'status success';
                                console.log('Service Worker activated');
                            }
                        });
                    });
                }

                // Reload if the SW is already waiting
                if (registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
            } catch (error) {
                statusDiv.textContent = `Service Worker: Error - ${error.message}`;
                statusDiv.className = 'status error';
                console.error('Service Worker registration failed:', error);
            }
        }

        registerServiceWorker();

        // Test functions
        const testArea = document.getElementById('test-area');

        function createSrcdocIframe() {
            console.log('Creating srcdoc iframe...');
            const iframe = document.createElement('iframe');
            iframe.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head><title>Srcdoc Iframe</title></head>
                <body>
                    <h3>Srcdoc Iframe Content</h3>
                    <p>This iframe was created with srcdoc.</p>
                    <p>Controlled by SW: <span id="sw-check">checking...</span></p>
                    <script>
                        // Check if we're controlled by a service worker
                        const check = document.getElementById('sw-check');
                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            check.textContent = 'YES';
                            check.style.color = 'green';
                        } else {
                            check.textContent = 'NO';
                            check.style.color = 'red';
                        }

                        // Try to fetch something
                        fetch('./test-resource.txt')
                            .then(r => r.text())
                            .then(t => console.log('Fetch from srcdoc iframe:', t))
                            .catch(e => console.error('Fetch from srcdoc iframe failed:', e));
                    <\/script>
                </body>
                </html>
            `;
            testArea.appendChild(iframe);
        }

        function createAboutBlankIframe() {
            console.log('Creating about:blank iframe...');
            const iframe = document.createElement('iframe');
            iframe.src = 'about:blank';
            testArea.appendChild(iframe);

            // Write content after the iframe loads
            iframe.onload = () => {
                const doc = iframe.contentDocument;
                doc.open();
                doc.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>About:blank Iframe</title></head>
                    <body>
                        <h3>About:blank Iframe Content</h3>
                        <p>This iframe was created with about:blank and document.write().</p>
                        <p>Controlled by SW: <span id="sw-check">checking...</span></p>
                        <script>
                            const check = document.getElementById('sw-check');
                            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                                check.textContent = 'YES';
                                check.style.color = 'green';
                            } else {
                                check.textContent = 'NO';
                                check.style.color = 'red';
                            }

                            fetch('./test-resource.txt')
                                .then(r => r.text())
                                .then(t => console.log('Fetch from about:blank iframe:', t))
                                .catch(e => console.error('Fetch from about:blank iframe failed:', e));
                        <\/script>
                    </body>
                    </html>
                `);
                doc.close();
            };
        }

        function createBlobIframe() {
            console.log('Creating blob: iframe...');
            const html = `
                <!DOCTYPE html>
                <html>
                <head><title>Blob Iframe</title></head>
                <body>
                    <h3>Blob Iframe Content</h3>
                    <p>This iframe was created with a blob: URL.</p>
                    <p>Controlled by SW: <span id="sw-check">checking...</span></p>
                    <script>
                        const check = document.getElementById('sw-check');
                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            check.textContent = 'YES';
                            check.style.color = 'green';
                        } else {
                            check.textContent = 'NO';
                            check.style.color = 'red';
                        }

                        fetch('./test-resource.txt')
                            .then(r => r.text())
                            .then(t => console.log('Fetch from blob iframe:', t))
                            .catch(e => console.error('Fetch from blob iframe failed:', e));
                    <\/script>
                </body>
                </html>
            `;
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const iframe = document.createElement('iframe');
            iframe.src = url;
            testArea.appendChild(iframe);
        }

        function createNestedIframes() {
            console.log('Creating nested iframes (3 levels)...');
            const level1Html = `
                <!DOCTYPE html>
                <html>
                <head><title>Level 1</title></head>
                <body style="background: #f0f0f0; padding: 10px;">
                    <h4>Level 1 (srcdoc)</h4>
                    <p>SW: <span id="sw">?</span></p>
                    <script>
                        document.getElementById('sw').textContent =
                            navigator.serviceWorker?.controller ? 'YES' : 'NO';

                        // Create level 2 iframe
                        const iframe = document.createElement('iframe');
                        iframe.style.cssText = 'width:100%;height:250px;border:2px solid blue;';
                        iframe.srcdoc = \`
                            <!DOCTYPE html>
                            <html>
                            <head><title>Level 2</title></head>
                            <body style="background: #e0e0e0; padding: 10px;">
                                <h4>Level 2 (srcdoc)</h4>
                                <p>SW: <span id="sw">?</span></p>
                                <script>
                                    document.getElementById('sw').textContent =
                                        navigator.serviceWorker?.controller ? 'YES' : 'NO';

                                    // Create level 3 iframe
                                    const iframe = document.createElement('iframe');
                                    iframe.style.cssText = 'width:100%;height:150px;border:2px solid green;';
                                    iframe.srcdoc = \\\`
                                        <!DOCTYPE html>
                                        <html>
                                        <head><title>Level 3</title></head>
                                        <body style="background: #d0d0d0; padding: 10px;">
                                            <h4>Level 3 (srcdoc)</h4>
                                            <p>SW: <span id="sw">?</span></p>
                                            <p id="fetch-result">Fetching...</p>
                                            <script>
                                                document.getElementById('sw').textContent =
                                                    navigator.serviceWorker?.controller ? 'YES' : 'NO';

                                                fetch('./test-resource.txt')
                                                    .then(r => r.text())
                                                    .then(t => {
                                                        document.getElementById('fetch-result').textContent = 'Fetch: ' + t;
                                                        document.getElementById('fetch-result').style.color = 'green';
                                                    })
                                                    .catch(e => {
                                                        document.getElementById('fetch-result').textContent = 'Fetch failed: ' + e;
                                                        document.getElementById('fetch-result').style.color = 'red';
                                                    });
                                            <\\/script>
                                        </body>
                                        </html>
                                    \\\`;
                                    document.body.appendChild(iframe);
                                <\\/script>
                            </body>
                            </html>
                        \`;
                        document.body.appendChild(iframe);
                    <\/script>
                </body>
                </html>
            `;

            const iframe = document.createElement('iframe');
            iframe.srcdoc = level1Html;
            testArea.appendChild(iframe);
        }

        function createTinyMCEIframe() {
            console.log('Creating TinyMCE iframe...');
            // First, create a regular iframe pointing to a controlled URL
            const iframe = document.createElement('iframe');
            iframe.src = './tinymce-host.html';
            iframe.style.height = '500px';
            testArea.appendChild(iframe);
        }

        function clearTests() {
            testArea.innerHTML = '';
            console.log('Test area cleared');
        }
    </script>
</body>
</html>
