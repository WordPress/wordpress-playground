<!DOCTYPE html>
<html>
<head><title>Level 1</title></head>
<body style="background: #f0f0f0; padding: 10px; margin: 0;">
    <h4>Level 1</h4>
    <p>SW: <span id="sw" style="font-weight: bold;">?</span></p>
    <p>Creating Level 2 iframe via srcdoc...</p>
    <div id="container"></div>

    <script>
        // Check SW status
        document.getElementById('sw').textContent =
            navigator.serviceWorker?.controller ? 'YES' : 'NO';
        document.getElementById('sw').style.color =
            navigator.serviceWorker?.controller ? 'green' : 'red';

        // Create Level 2 iframe using srcdoc
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'width:100%;height:250px;border:2px solid blue;';
        iframe.srcdoc = `
            <!DOCTYPE html>
            <html>
            <head><title>Level 2</title></head>
            <body style="background: #e0e0e0; padding: 10px; margin: 0;">
                <h4>Level 2 (via srcdoc)</h4>
                <p>SW: <span id="sw" style="font-weight: bold;">?</span></p>
                <p>Creating Level 3 iframe via srcdoc...</p>
                <div id="container"></div>
                <script>
                    document.getElementById('sw').textContent =
                        navigator.serviceWorker?.controller ? 'YES' : 'NO';
                    document.getElementById('sw').style.color =
                        navigator.serviceWorker?.controller ? 'green' : 'red';

                    // Create Level 3 iframe
                    const iframe3 = document.createElement('iframe');
                    iframe3.style.cssText = 'width:100%;height:120px;border:2px solid green;';
                    iframe3.srcdoc = '<!DOCTYPE html><html><head><title>Level 3</title></head><body style="background:#d0d0d0;padding:10px;margin:0;"><h4>Level 3 (via srcdoc)</h4><p>SW: <span id="sw" style="font-weight:bold;">?</span></p><p id="fetch-result">Fetching test-resource.txt...</p><scr' + 'ipt>document.getElementById("sw").textContent=navigator.serviceWorker?.controller?"YES":"NO";document.getElementById("sw").style.color=navigator.serviceWorker?.controller?"green":"red";fetch("./test-resource.txt").then(r=>r.text()).then(t=>{document.getElementById("fetch-result").textContent="Fetch result: "+t;document.getElementById("fetch-result").style.color="green";}).catch(e=>{document.getElementById("fetch-result").textContent="Fetch failed: "+e;document.getElementById("fetch-result").style.color="red";});</scr' + 'ipt></body></html>';
                    document.getElementById('container').appendChild(iframe3);
                <\/script>
            </body>
            </html>
        `;
        document.getElementById('container').appendChild(iframe);
    </script>
</body>
</html>
