<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>WordPress Playground</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body,
			#wp {
				height: 100%;
				width: 100%;
				margin: 0;
				padding: 0;
				border: 0;
			}

			html,
			body {
				overflow: hidden;
			}

			body.has-error {
				padding: 24px;
				background: #f6f6f6;
				color: #1a1919;
				display: flex;
				flex-direction: column;
				align-items: center;
				overflow: auto;
				font:
					14px/1.6 -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
			}

			body.has-error .error-message {
				margin: auto;
				padding: clamp(24px, 5vw, 40px);
				width: 100%;
				max-width: 680px;
				background: #fff;
				border: 1px solid rgba(26, 25, 25, 0.08);
				border-radius: 14px;
				box-shadow: 0 8px 32px rgba(26, 25, 25, 0.06);
				overflow-wrap: anywhere;
			}

			.error-message h1 {
				margin: 0 0 12px;
				font-size: clamp(22px, 4vw, 28px);
				line-height: 1.25;
				letter-spacing: -0.02em;
			}

			.error-message p {
				margin: 0 0 20px;
			}

			.error-details {
				margin: 24px 0;
				padding: 16px;
				border-radius: 8px;
				background: #ececec;
			}

			.error-details-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: 12px;
			}

			.error-details h2 {
				margin: 0;
				font-size: 14px;
			}

			.error-details pre {
				margin: 16px 0 0;
				max-height: 240px;
				overflow: auto;
				white-space: pre-wrap;
				font:
					12px/1.6 'SFMono-Regular',
					Consolas,
					monospace;
				user-select: text;
			}

			body.has-error button {
				border: 1px solid #3858e9;
				border-radius: 6px;
				background: #3858e9;
				color: #fff;
				font: inherit;
				font-weight: 500;
				padding: 8px 16px;
				cursor: pointer;
			}

			body.has-error button:hover {
				background: #213fd4;
			}

			body.has-error .copy-error {
				border-color: #656a71;
				background: transparent;
				color: inherit;
				padding: 4px 10px;
			}

			body.has-error .copy-error:hover {
				background: rgba(127, 127, 127, 0.12);
			}

			.error-message a {
				color: #1d35b4;
				text-underline-offset: 3px;
			}

			.error-message :focus-visible {
				outline: 2px solid #3858e9;
				outline-offset: 3px;
			}

			.error-message .copy-status {
				margin: 8px 0 0;
				font-size: 13px;
			}

			.error-message .report-issue {
				margin: 20px 0 0;
			}

			@media (prefers-color-scheme: dark) {
				body.is-loading,
				body.has-error {
					background: #1e1e1e;
					color: #fff;
				}
				body.has-error .error-message {
					background: #262626;
					border-color: #404040;
				}
				body.has-error .error-details {
					background: #333;
				}
				.error-message a {
					color: #9fb1ff;
				}
			}
		</style>

	<body class="is-loading">
		<iframe
			id="wp"
			title="The WordPress site"
			sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals"
		></iframe>
		<script type="module">
			if (window.top != window.self) {
				document.body.classList.add('is-embedded');
			}
			import { bootPlaygroundRemote } from './src/index';
			try {
				window.playground = await bootPlaygroundRemote();
			} catch (e) {
				console.error(e);
				document.body.className = 'has-error';
				document.body.innerHTML = '';

				if (e?.name === 'NotSupportedError') {
					document.body.append(await renderStorageErrorUI());
				} else {
					document.body.append(renderGenericErrorUI(e));
				}
			} finally {
				document.body.classList.remove('is-loading');
			}

			function renderGenericErrorUI(error) {
				const panel = document.createElement('main');
				panel.className = 'error-message';
				panel.innerHTML = `
					<h1>Playground couldn’t start</h1>
					<p class="error-description"></p>
					<section class="error-details" aria-labelledby="error-details-title">
						<div class="error-details-header">
							<h2 id="error-details-title">Error details</h2>
							<button type="button" class="copy-error">Copy error</button>
						</div>
						<pre tabindex="0"></pre>
						<p class="copy-status" role="status"></p>
					</section>
					<p>Try again. If it keeps happening, copy the error details to help us investigate.</p>
					<button type="button" class="retry">Try again</button>
					<p class="report-issue">
						<a href="https://github.com/WordPress/wordpress-playground/issues/new"
							target="_blank" rel="noopener noreferrer">Report an issue on GitHub</a>
					</p>
				`;
				panel.querySelector('.error-description').textContent =
					error?.userFriendlyMessage ||
					'An unexpected error stopped Playground from starting. The details below may explain why.';
				const details = panel.querySelector('pre');
				details.textContent =
					error?.stack ||
					error?.message ||
					String(error ?? 'No error details were provided.');
				panel.querySelector('.copy-error').onclick = async () => {
					const status = panel.querySelector('.copy-status');
					try {
						await navigator.clipboard.writeText(
							[
								panel.querySelector('h1').textContent,
								panel.querySelector('.error-description')
									.textContent,
								details.textContent,
							].join('\n\n')
						);
						status.textContent = 'Error copied.';
					} catch {
						status.textContent =
							'Couldn’t copy automatically. Select the error details and copy them manually.';
						const selection = window.getSelection();
						const range = document.createRange();
						range.selectNodeContents(details);
						selection?.removeAllRanges();
						selection?.addRange(range);
						details.focus();
					}
				};
				panel.querySelector('.retry').onclick = () =>
					window.location.reload();
				return panel;
			}

			async function renderStorageErrorUI() {
				const fragment = document.createDocumentFragment();

				/**
				 * Chrome does not allow Service Workers to be registered from cross-origin iframes
				 * when third-party cookies are disabled unless `requestStorageAccess()` is called
				 * and the user grants storage access.
				 *
				 * Let's assess the situation and provide a helpful message.
				 */
				let hasStorageAccess = false;
				try {
					const { state } = await navigator.permissions.query({
						name: 'storage-access',
					});
					hasStorageAccess = state === 'granted';
				} catch (e) {
					// noop
				}

				if (hasStorageAccess || !('requestStorageAccess' in document)) {
					const div = document.createElement('div');

					// The user has granted storage access, but the error still persists.
					// Let's explain why.
					div.innerText =
						'It looks like you have disabled third-party cookies in your browser. This ' +
						'also disables the Service Worker API used by WordPress Playground. Please re-enable ' +
						'third-party cookies and try again.';
					fragment.append(div);

					const button = document.createElement('button');
					button.innerText = 'Try again';
					button.onclick = () => {
						window.location.reload();
					};
					fragment.append(button);
				} else {
					const div = document.createElement('div');

					// The user has not granted storage access.
					// There's a chance we can fix this by asking for storage access.
					div.innerText =
						'WordPress Playground needs to use storage in your browser.';
					fragment.append(div);

					const button = document.createElement('button');
					button.innerText = 'Allow storage access';
					fragment.append(button);

					button.onclick = async () => {
						try {
							await document.requestStorageAccess();
							window.location.reload();
						} catch (e) {
							// Either the user denied storage access OR chrome is not allowing
							// storage access to be requested from an iframe for some reason.

							// The two errors are indistinguishable and just say "requestStorageAccess not allowed"
							// https://source.chromium.org/chromium/chromium/src/+/main:third_party/blink/renderer/core/dom/document.cc;drc=daf56cfa413f10dee6aa15b0b1e4572fcf5578df;l=462
							// It's confusing! But we can at least tell the user what to do.
							div.innerHTML = `
								<p>
									Oops! Playground failed to start. Here's what to do:
								</p>

								<h3>Did you disable third-party cookies?</h3>
								<p>
									It also disables the required Service Worker API. Please re-enable
									third-party cookies and try again.
								</p>

								<h3>Did you refuse to grant Playground storage access?</h3>
								<p>
									Click the button below and grant storage access. Note the button may
									not work if you have disabled third-party cookies in your browser.
								</p>
								<p>
									If neither method helped, please
									<a href="https://github.com/WordPress/wordpress-playground/issues/new"
										target="_blank">
										report an issue on GitHub
									</a>.
								</p>
								`;
						}
					};
				}

				return fragment;
			}
		</script>
	</body>
</html>
