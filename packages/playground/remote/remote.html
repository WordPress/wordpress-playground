<!doctype html>
<html>
	<head>
		<title>WordPress Playground</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body,
			#wp {
				height: 100%;
				width: 100%;
				margin: 0;
				padding: 0;
				border: 0;
			}

			html,
			body {
				overflow: hidden;
			}

			body.has-error {
				padding: 15px;
				background: #f1f1f1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				font-family: Arial, Helvetica, sans-serif;
				line-height: 1.4;
			}
			body.has-error .error-message {
				padding: 20px;
				max-width: 800px;
			}
			body.has-error button {
				margin-top: 15px;
				margin-bottom: 15px;
				font-size: 20px;
				padding: 5px 10px;
				cursor: pointer;
			}

			@media (prefers-color-scheme: dark) {
				body.is-loading,
				body.has-error {
					background: #1e1e1e;
					color: #fff;
				}
			}
		</style>

		/>
		<script>
			window.__playgroundStartup = (() => {
				let settled = false;
				let clientHandlesRetry = false;
				const onClientErrorHandled = (event) => {
					if (
						event.source !== window.parent ||
						event.data?.type !==
							'playground-runtime-startup-error-handled'
					)
						return;
					clientHandlesRetry = true;
					window.removeEventListener('message', onClientErrorHandled);
					const button = document.getElementById(
						'playground-startup-retry'
					);
					if (button) button.replaceWith(createParentRetryMessage());
				};
				window.addEventListener('message', onClientErrorHandled);
				window.parent.postMessage(
					{ type: 'playground-runtime-startup-started' },
					'*'
				);
				const onScriptError = (event) => {
					if (
						event.target instanceof HTMLScriptElement &&
						event.target.type === 'module'
					) {
						void failed(
							new Error(
								'Failed to load Playground startup script: ' +
									event.target.src
							)
						);
					}
				};
				window.addEventListener('error', onScriptError, true);

				function complete(keepRetryListener = false) {
					settled = true;
					window.removeEventListener('error', onScriptError, true);
					if (!keepRetryListener)
						window.removeEventListener(
							'message',
							onClientErrorHandled
						);
					document.body?.classList.remove('is-loading');
				}

				async function failed(error) {
					if (settled) return;
					// Reload-required is handled by the embedding application's existing prompt.
					if (error?.message === 'playground-reload-required') {
						complete();
						return;
					}
					complete(true);
					const recovery =
						error?.name === 'NotSupportedError'
							? 'storage-access'
							: undefined;
					const message = String(
						error?.message ?? error ?? 'Unknown startup failure'
					);
					const name =
						typeof error?.name === 'string' ? error.name : 'Error';
					console.error(error);
					// The embedder may hide its referrer. Send only startup diagnostics;
					// the SDK validates this window and origin before accepting them.
					window.parent.postMessage(
						{
							type: 'playground-runtime-startup-error',
							recovery,
							error: { name, message },
						},
						'*'
					);
					if (!document.body) {
						await new Promise((resolve) =>
							document.addEventListener(
								'DOMContentLoaded',
								resolve,
								{ once: true }
							)
						);
					}
					document.body.className = 'has-error';
					document.body.innerHTML = '';

					if (name === 'NotSupportedError') {
						document.body.append(await renderStorageErrorUI());
					} else {
						document.body.append(renderGenericErrorUI(error));
					}
				}

				function createParentRetryMessage() {
					const message = document.createElement('p');
					message.textContent =
						'Reload the page containing this Playground to try again.';
					return message;
				}

				function renderGenericErrorUI(error) {
					const fragment = document.createDocumentFragment();

					const div = document.createElement('div');
					div.className = 'error-message';
					const userFriendlyMessage =
						error?.userFriendlyMessage ||
						'See the developer tools for error details.';
					div.innerHTML =
						'Ooops! WordPress Playground had a hiccup! <br/><br/> ' +
						userFriendlyMessage;
					fragment.append(div);

					const button = document.createElement('button');
					button.innerText = 'Try again';
					button.onclick = () => {
						window.location.reload();
					};
					button.id = 'playground-startup-retry';
					fragment.append(
						clientHandlesRetry ? createParentRetryMessage() : button
					);

					const reportIssues = document.createElement('p');
					reportIssues.innerHTML = `
					If the problem persists, please
					<a href="https://github.com/WordPress/wordpress-playground/issues/new"
						target="_blank"
						>report an issue on GitHub</a>.
				`;
					fragment.append(reportIssues);

					return fragment;
				}

				async function renderStorageErrorUI() {
					const fragment = document.createDocumentFragment();

					/**
					 * Chrome does not allow Service Workers to be registered from cross-origin iframes
					 * when third-party cookies are disabled unless `requestStorageAccess()` is called
					 * and the user grants storage access.
					 *
					 * Let's assess the situation and provide a helpful message.
					 */
					let hasStorageAccess = false;
					try {
						const { state } = await navigator.permissions.query({
							name: 'storage-access',
						});
						hasStorageAccess = state === 'granted';
					} catch (e) {
						// noop
					}

					if (
						hasStorageAccess ||
						!('requestStorageAccess' in document)
					) {
						const div = document.createElement('div');

						// The user has granted storage access, but the error still persists.
						// Let's explain why.
						div.innerText =
							'It looks like you have disabled third-party cookies in your browser. This ' +
							'also disables the Service Worker API used by WordPress Playground. Please re-enable ' +
							'third-party cookies and try again.';
						fragment.append(div);

						const button = document.createElement('button');
						button.innerText = 'Try again';
						button.onclick = () => {
							window.location.reload();
						};
						fragment.append(button);
					} else {
						const div = document.createElement('div');

						// The user has not granted storage access.
						// There's a chance we can fix this by asking for storage access.
						div.innerText =
							'WordPress Playground needs to use storage in your browser.';
						fragment.append(div);

						const button = document.createElement('button');
						button.innerText = 'Allow storage access';
						fragment.append(button);

						button.onclick = async () => {
							try {
								await document.requestStorageAccess();
								window.location.reload();
							} catch (e) {
								// Either the user denied storage access OR chrome is not allowing
								// storage access to be requested from an iframe for some reason.

								// The two errors are indistinguishable and just say "requestStorageAccess not allowed"
								// https://source.chromium.org/chromium/chromium/src/+/main:third_party/blink/renderer/core/dom/document.cc;drc=daf56cfa413f10dee6aa15b0b1e4572fcf5578df;l=462
								// It's confusing! But we can at least tell the user what to do.
								div.innerHTML = `
								<p>
									Oops! Playground failed to start. Here's what to do:
								</p>

								<h3>Did you disable third-party cookies?</h3>
								<p>
									It also disables the required Service Worker API. Please re-enable
									third-party cookies and try again.
								</p>

								<h3>Did you refuse to grant Playground storage access?</h3>
								<p>
									Click the button below and grant storage access. Note the button may
									not work if you have disabled third-party cookies in your browser.
								</p>
								<p>
									If neither method helped, please
									<a href="https://github.com/WordPress/wordpress-playground/issues/new"
										target="_blank">
										report an issue on GitHub
									</a>.
								</p>
								`;
							}
						};
					}

					return fragment;
				}
				return {
					complete,
					failed,
				};
			})();
		</script>
	</head>
	<body class="is-loading">
		<iframe
			id="wp"
			title="The WordPress site"
			sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-downloads allow-modals"
		></iframe>
		<script type="module">
			if (window.top != window.self) {
				document.body.classList.add('is-embedded');
			}
			try {
				const { bootPlaygroundRemote } = await import('./src/index');
				window.playground = await bootPlaygroundRemote();
				window.__playgroundStartup.complete();
			} catch (error) {
				await window.__playgroundStartup.failed(error);
			}
		</script>
	</body>
</html>
