[global]
daemonize = no
error_log = /dev/stderr
log_level = notice

[www]
; Per-boot port (reserveFreePort) so concurrent vitest workers don't
; collide on a hard-coded 9000.
listen = 127.0.0.1:__FPM_PORT__

; php-fpm refuses to start as root without explicit user/group.
; kandelo's sys_setuid drops to uid 99.
user = nobody
group = nobody

pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no

slowlog = /dev/null
request_slowlog_trace_depth = 0

; php-fpm runs with `-c /dev/null` (no php.ini) so the compiled-in
; default is display_errors=On under FastCGI, which writes notices
; into the response body and breaks redirects.
php_admin_flag[display_errors] = off

; With fix_pathinfo=1, FPM truncates SCRIPT_FILENAME at each `/` and
; lands on the tempdir, bailing with "Primary script unknown".
php_admin_value[cgi.fix_pathinfo] = 0
