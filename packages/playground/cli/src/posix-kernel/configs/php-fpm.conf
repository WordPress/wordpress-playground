[global]
daemonize = no
error_log = /dev/stderr
log_level = notice

[www]
listen = 127.0.0.1:9000

; The kernel runs every process as root; php-fpm refuses to start
; without an explicit user/group when invoked as root, even though
; setuid is a no-op inside the wasm sandbox.
user = nobody
group = nobody

pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no

slowlog = /dev/null
request_slowlog_trace_depth = 0

; php-fpm is started with `-c /dev/null` (no php.ini), so PHP falls
; back to compiled-in defaults — display_errors=On under FastCGI.
; That writes E_USER_NOTICE/E_WARNING into the response body, e.g.
; wp_version_check()'s trigger_error() output prepended to wp-admin
; HTML, which then trips "headers already sent" cascades. Disable
; in-response display; errors still flow to stderr via the global
; error_log = /dev/stderr above.
php_admin_flag[display_errors] = off
