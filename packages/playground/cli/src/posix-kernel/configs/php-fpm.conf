[global]
daemonize = no
error_log = /dev/stderr
log_level = notice

[www]
listen = 127.0.0.1:9000

; The kernel runs every process as root; php-fpm refuses to start
; without an explicit user/group when invoked as root, even though
; setuid is a no-op inside the wasm sandbox.
user = nobody
group = nobody

pm = static
pm.max_children = 1

clear_env = no

slowlog = /dev/null
request_slowlog_trace_depth = 0

; Mirror WP Playground's install-time hardening from
; packages/playground/wordpress/src/boot.ts:578-583. Without these
; settings the WP installer's wp_install_maybe_enable_pretty_permalinks()
; helper opens a self-loopback HTTP request to the same host:port, which
; deadlocks against pm.max_children = 1 (the only FPM worker is already
; busy serving the install POST that triggered the loopback).
;
; disable_functions / allow_url_fopen are PHP_INI_SYSTEM, so they cannot
; be ini_set()'d at request time and the wrap WP Playground does on the
; programmatic PHP API isn't reachable from the FPM HTTP path.
php_admin_value[disable_functions] = fsockopen
php_admin_value[allow_url_fopen] = 0
