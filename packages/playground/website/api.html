<!doctype html>
<html>
	<head>
		<title>WordPress Playground API</title>
	</head>
	<body>
		<p id="api-description" hidden>
			WordPress Playground uses this page to export saved sites. It isn't
			intended to be opened directly.
		</p>
		<script>
			if (window.self === window.top) {
				document.getElementById('api-description').hidden = false;
			}
		</script>
		<script type="module">
			import { assertDocumentOrigin } from '../remote/src/lib/deployment';
			import { playgroundOrigin } from '../remote/src/lib/config';
			assertDocumentOrigin('app');

			if (window.self !== window.top) {
				const { bootPlaygroundAPI } =
					await import('./src/lib/boot-playground-api');
				window.playgroundAPI = bootPlaygroundAPI(playgroundOrigin);
			}
		</script>
	</body>
</html>
