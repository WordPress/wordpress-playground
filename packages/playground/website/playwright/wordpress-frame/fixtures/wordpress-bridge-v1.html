<!doctype html>
<!--
	An older WordPress bridge, kept as a test fixture. Its message fields and body
	stream format must stay as they were, even when the production bridge changes.
	The upgrade test checks that a new service worker can still talk to this bridge
	in an already-open tab. Updating both together could hide a breaking change.
-->
<script type="module">
	const appOrigin = '__APP_ORIGIN__';
	const scope = new URL(location.href).searchParams.get('scope');
	const registration = await navigator.serviceWorker.register('/sw.js', {
		type: 'module',
		updateViaCache: 'none',
	});
	await navigator.serviceWorker.ready;
	const worker =
		registration.installing ?? registration.waiting ?? registration.active;
	while (worker.state !== 'activated') {
		await new Promise((resolve) =>
			worker.addEventListener('statechange', resolve, { once: true })
		);
	}
	navigator.serviceWorker.addEventListener('message', (event) => {
		if (event.source !== registration.active || event.data?.scope !== scope)
			return;
		parent.postMessage(
			{ ...event.data, type: 'wordpress-bridge-request' },
			appOrigin
		);
	});
	addEventListener('message', (event) => {
		if (
			event.source !== parent ||
			event.origin !== appOrigin ||
			event.data?.type !== 'wordpress-bridge-response' ||
			event.data.scope !== scope
		)
			return;
		const { requestId, response } = event.data;
		// Forward body chunks through a new port before sending them across origins again.
		// Keep this old implementation here; importing today's utility would change the test.
		if (response.bodyPort) {
			const source = response.bodyPort;
			const { port1, port2 } = new MessageChannel();
			source.onmessage = (event) => {
				port1.postMessage(event.data);
				if (event.data.t === 'close' || event.data.t === 'error') {
					source.close();
					port1.close();
				}
			};
			port1.onmessage = (event) => source.postMessage(event.data);
			response.bodyPort = port2;
		}
		registration.active.postMessage(
			{ type: 'response', requestId, response },
			response.bodyPort ? [response.bodyPort] : []
		);
	});
	parent.postMessage({ type: 'wordpress-bridge-ready', scope }, appOrigin);
</script>
