<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>WordPress Playground</title>
		<base href="/" />
		<meta
			property="og:image"
			content="https://playground.wordpress.net/ogimage.png"
		/>
		<meta property="og:title" content="WordPress Playground" />
		<meta
			property="og:description"
			content="WordPress running in your browser for learning, testing, and developing with WordPress!"
		/>
		<meta property="og:url" content="https://playground.wordpress.net/" />
		<meta
			name="description"
			content="WordPress running in your browser for learning, testing, and developing with WordPress!"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="stylesheet" href="/src/styles.css" />
		<script>
			/**
			 * Dynamically create <link rel="manifest" /> to enable using Playground with
			 * a Blueprint as an offline progressive web app.
			 *
			 * We don't have a static <link rel="manifest" /> element in the initial HTML
			 * because Safari would just go with it and ignore the dynamic updates made below.
			 * It has no problem with dynamically created manifest element, though.
			 *
			 * If this method ever fails, we'll need to rename index.html to index.php and
			 * ensure the <link rel="manifest" /> element is shipped in the initial HTML.
			 */

			/**
			 * On the local dev server, use the static manifest.json file.
			 * Outside of the local dev server, use the dynamic manifest that
			 * passes the query parameters through to the "start_url" property.
			 */
			let manifestUrl = '/manifest.json';

			/**
			 * In production, load a manifest URL that includes the current URL
			 * as the "start_url" parameter.
			 */
			if (window.location.port !== '5400') {
				const runningAsPWA = window.matchMedia(
					'(display-mode: standalone)'
				).matches;

				/**
				 * If we're running as an installed, offline app, keep referencing the
				 * same manifest.json file every time.
				 */
				if (runningAsPWA) {
					if (localStorage.getItem('manifestUrl')) {
						manifestUrl = localStorage.getItem('manifestUrl');
					}
				}

				if (!manifestUrl) {
					manifestUrl = new URL(
						'/dynamic-manifest.json.php',
						window.location.href
					);
					manifestUrl.search = window.location.search;

					/**
					 * In PWAs, remember the initial manifest on the first run.
					 */
					if (runningAsPWA) {
						localStorage.setItem(
							'manifestUrl',
							manifestUrl.toString()
						);
					}
				}
			}
			const newLink = document.createElement('link');
			newLink.rel = 'manifest';
			newLink.href = manifestUrl.toString();
			document.head.appendChild(newLink);
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- @TODO: Only load Roboto in non-apple environments where the San Francisco font is unavailable -->
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<script>
			/**
			 * Detect in-app browsers (WebViews) used by social media
			 * apps. These environments lack support for
			 * SharedArrayBuffer, Service Workers, and other APIs
			 * that Playground requires.
			 */
			var isInAppBrowser = (function () {
				var ua = navigator.userAgent || '';
				var inAppPatterns = [
					'FBAN',
					'FBAV',
					'Instagram',
					'LinkedInApp',
					'Twitter',
					'Line/',
					'MicroMessenger',
					'Snapchat',
					'Pinterest',
					'BytedanceWebview',
					'musical_ly',
					'TikTok',
				];
				for (var i = 0; i < inAppPatterns.length; i++) {
					if (ua.indexOf(inAppPatterns[i]) !== -1) {
						return true;
					}
				}
				if (/\bwv\b/.test(ua) && /Android/.test(ua)) {
					return true;
				}
				return false;
			})();

			if (isInAppBrowser) {
				document.documentElement.classList.add('in-app-browser');
			}
		</script>

		<div
			id="in-app-browser-notice"
			aria-label="Browser compatibility notice"
		>
			<div class="in-app-browser-notice__card">
				<div class="in-app-browser-notice__icon" aria-hidden="true">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 122.52 122.523"
						width="60"
						height="60"
					>
						<g fill="#1e8cbe">
							<path
								d="m8.708 61.26c0 20.802 12.089 38.779 29.619 47.298l-25.069-68.686c-2.916 6.536-4.55 13.769-4.55 21.388z"
							/>
							<path
								d="m96.74 58.608c0-6.495-2.333-10.993-4.334-14.494-2.664-4.329-5.161-7.995-5.161-12.324 0-4.831 3.664-9.328 8.825-9.328.233 0 .454.029.681.042-9.35-8.566-21.807-13.796-35.489-13.796-18.36 0-34.513 9.42-43.91 23.688 1.233.037 2.395.063 3.382.063 5.497 0 14.006-.667 14.006-.667 2.833-.167 3.167 3.994.337 4.329 0 0-2.847.335-6.015.501l19.138 56.925 11.501-34.493-8.188-22.434c-2.83-.166-5.511-.501-5.511-.501-2.832-.166-2.5-4.496.332-4.329 0 0 8.679.667 13.843.667 5.496 0 14.006-.667 14.006-.667 2.835-.167 3.168 3.994.337 4.329 0 0-2.853.335-6.015.501l18.992 56.494 5.242-17.517c2.272-7.269 4.001-12.49 4.001-16.989z"
							/>
							<path
								d="m62.184 65.857-15.768 45.819c4.708 1.384 9.687 2.141 14.846 2.141 6.12 0 11.989-1.058 17.452-2.979-.141-.225-.269-.464-.374-.724z"
							/>
							<path
								d="m107.376 36.046c.226 1.674.354 3.471.354 5.404 0 5.333-.996 11.328-3.996 18.824l-16.053 46.449c15.624-9.111 26.133-26.038 26.133-45.463.001-9.541-2.468-18.51-6.438-26.214z"
							/>
							<path
								d="m61.262 0c-33.779 0-61.262 27.481-61.262 61.26 0 33.783 27.483 61.263 61.262 61.263 33.778 0 61.258-27.48 61.258-61.263 0-33.779-27.48-61.26-61.258-61.26zm0 119.715c-32.23 0-58.453-26.223-58.453-58.455 0-32.23 26.222-58.451 58.453-58.451 32.229 0 58.45 26.221 58.45 58.451 0 32.232-26.221 58.455-58.45 58.455z"
							/>
						</g>
					</svg>
				</div>
				<h1 class="in-app-browser-notice__title">
					Open in your browser
				</h1>
				<p class="in-app-browser-notice__description">
					WordPress Playground needs features that aren't available in
					this app's built-in browser. Please open this page in
					Chrome, Safari, Firefox, or another full browser.
				</p>
				<div class="in-app-browser-notice__instructions">
					<p>
						Look for an <strong>"Open in browser"</strong> option in
						this app's menu &mdash; usually behind a
						<strong>&hellip;</strong> or share icon.
					</p>
				</div>
				<button
					id="in-app-browser-copy-url"
					class="in-app-browser-notice__button"
				>
					Copy link
				</button>
				<button
					id="in-app-browser-continue"
					class="in-app-browser-notice__link"
				>
					Continue anyway
				</button>
			</div>
			<script>
				document
					.getElementById('in-app-browser-copy-url')
					.addEventListener('click', function () {
						var btn = this;
						if (navigator.clipboard) {
							navigator.clipboard
								.writeText(window.location.href)
								.then(function () {
									btn.textContent = 'Copied!';
									setTimeout(function () {
										btn.textContent = 'Copy link';
									}, 2000);
								});
						}
					});

				document
					.getElementById('in-app-browser-continue')
					.addEventListener('click', function () {
						document.documentElement.classList.remove(
							'in-app-browser'
						);
						isInAppBrowser = false;

						var evt = new Event('playground-continue');
						document.dispatchEvent(evt);
					});
			</script>
		</div>

		<main id="root" aria-label="WordPress Playground">
			<script>
				const query = new URLSearchParams(window.location.search);
				const shouldLazyLoadPlayground =
					query.has('lazy') ||
					// Initial API used "start_button" - this preserves compatibility.
					'1' === query.get('start_button');

				if (shouldLazyLoadPlayground) {
					const query = new URLSearchParams(window.location.search);
					query.delete('lazy');
					query.delete('start_button');
					const nonLazyUrl = new URL(window.location);
					nonLazyUrl.search = query.toString();

					const initiator = document.createElement('a');
					initiator.innerText = 'Run Playground';
					initiator.setAttribute('id', 'lazy-load-initiator');
					initiator.setAttribute('href', nonLazyUrl);

					const root = document.getElementById('root');
					root.classList.add('lazy-loading');
					root.appendChild(initiator);
				}
			</script>
		</main>
		<script type="module">
			function loadPlayground() {
				/**
				 * Safari sometimes fail to import this script after
				 * playground.wordpress.net is deployed. The error is:
				 *
				 * ```
				 * TypeError: Importing a module script failed.
				 * ```
				 *
				 * Manually clearing Safari cache resolves it, so we
				 * retry with a cache-busting query parameter.
				 */
				import('./src/main').catch((e) => {
					console.error('Failed to load main module:', e);
					try {
						const stringifiedImport = (() =>
							import('./src/main')).toString();
						const moduleUrlString = stringifiedImport.match(
							/import\(\s*['"](.+?)['"]\s*\)/
						)[1];
						if (moduleUrlString) {
							const moduleUrl = new URL(
								moduleUrlString,
								import.meta.url
							);
							moduleUrl.searchParams.set(
								'_ts',
								String(Date.now())
							);
							return import(
								/* @vite-ignore */ moduleUrl.toString()
							);
						}
					} catch {
						// Fall back to the original error
					}
					throw e;
				});
			}

			if (!shouldLazyLoadPlayground && !isInAppBrowser) {
				loadPlayground();
			} else if (isInAppBrowser && !shouldLazyLoadPlayground) {
				document.addEventListener(
					'playground-continue',
					loadPlayground,
					{ once: true }
				);
			}
		</script>
	</body>
</html>
