<!doctype html>
<html lang="en">
	<head>
		<title>Playground WebRTC Sync</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
				display: flex;
				flex-direction: column;
				height: 100dvh;
			}
			#controls {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 8px 12px;
				background: #1e1e1e;
				color: #fff;
				font-size: 14px;
			}
			#controls button {
				padding: 6px 14px;
				border: none;
				border-radius: 4px;
				background: #3858e9;
				color: #fff;
				cursor: pointer;
				font-size: 14px;
			}
			#controls button:hover {
				background: #2a45c0;
			}
			#controls button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			#controls input {
				padding: 6px 10px;
				border: 1px solid #555;
				border-radius: 4px;
				background: #2d2d2d;
				color: #fff;
				font-size: 14px;
				width: 100px;
				text-transform: uppercase;
				letter-spacing: 2px;
				text-align: center;
			}
			#room-code {
				font-weight: bold;
				font-size: 16px;
				letter-spacing: 3px;
				color: #7ee787;
			}
			#status {
				margin-left: auto;
			}
			.status-dot {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				margin-right: 6px;
			}
			.status-dot.new {
				background: #888;
			}
			.status-dot.signaling {
				background: #f0ad4e;
			}
			.status-dot.connecting {
				background: #f0ad4e;
			}
			.status-dot.connected {
				background: #7ee787;
			}
			.status-dot.syncing {
				background: #58a6ff;
			}
			.status-dot.ready {
				background: #7ee787;
			}
			.status-dot.disconnected {
				background: #f85149;
			}
			.status-dot.failed {
				background: #f85149;
			}
			#content {
				flex: 1;
				position: relative;
			}
			iframe {
				width: 100%;
				height: 100%;
				border: 0;
			}
			#overlay {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #f6f6f6;
				color: #333;
				gap: 16px;
				z-index: 10;
			}
			#overlay.hidden {
				display: none;
			}
			.spinner {
				width: 32px;
				height: 32px;
				border: 3px solid #ddd;
				border-top-color: #3858e9;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			#overlay-status {
				font-size: 16px;
			}
		</style>
	</head>
	<body>
		<div id="controls">
			<button id="create-btn">Create Room</button>
			<span>or</span>
			<input id="room-input" placeholder="CODE" maxlength="6" />
			<button id="join-btn">Join</button>
			<span id="room-code"></span>
			<span id="status">
				<span class="status-dot new"></span>
				Not connected
			</span>
		</div>
		<div id="content">
			<div id="overlay" class="hidden">
				<div class="spinner"></div>
				<div id="overlay-status"></div>
			</div>
			<iframe id="wp"></iframe>
		</div>
		<script type="module">
			import {
				createRoom,
				connectAndSync,
				SignalingClient,
			} from './webrtc-sync.ts';

			const createBtn = document.getElementById('create-btn');
			const joinBtn = document.getElementById('join-btn');
			const roomInput = document.getElementById('room-input');
			const roomCodeEl = document.getElementById('room-code');
			const statusEl = document.getElementById('status');
			const iframe = document.getElementById('wp');
			const overlay = document.getElementById('overlay');
			const overlayStatus = document.getElementById('overlay-status');

			const signalingUrl = new URL(
				'/signaling.php',
				window.location.origin
			).toString();

			const STATE_LABELS = {
				new: 'Not connected',
				signaling: 'Signaling...',
				connecting: 'Connecting...',
				connected: 'Connected',
				syncing: 'Syncing...',
				ready: 'Connected',
				disconnected: 'Disconnected',
				failed: 'Failed',
			};

			function setStatus(state) {
				const label = STATE_LABELS[state] || state;
				statusEl.innerHTML = `<span class="status-dot ${state}"></span>${label}`;
			}

			function disableControls() {
				createBtn.disabled = true;
				joinBtn.disabled = true;
				roomInput.disabled = true;
			}

			function showOverlay(text) {
				overlay.classList.remove('hidden');
				iframe.style.visibility = 'hidden';
				overlayStatus.textContent = text;
			}

			function hideOverlay() {
				overlay.classList.add('hidden');
				iframe.style.visibility = 'visible';
			}

			createBtn.addEventListener('click', async () => {
				disableControls();
				setStatus('signaling');

				const signalingClient = new SignalingClient({
					baseUrl: signalingUrl,
				});
				const roomCode = await createRoom(signalingClient);
				roomCodeEl.textContent = roomCode;

				await connectAndSync(iframe, 'offerer', roomCode, (state) => {
					setStatus(state);
				});
			});

			joinBtn.addEventListener('click', async () => {
				const code = roomInput.value.trim().toUpperCase();
				if (!code) return;
				disableControls();

				showOverlay('Booting WordPress...');
				setStatus('connecting');

				await connectAndSync(iframe, 'answerer', code, (state) => {
					setStatus(state);

					if (state === 'connected') {
						showOverlay('Syncing...');
					} else if (state === 'syncing') {
						showOverlay('Syncing...');
					} else if (state === 'ready') {
						hideOverlay();
					}
				});
			});
		</script>
	</body>
</html>
