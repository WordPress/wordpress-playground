name: Clone the repository, install dependencies, and configures nx variables

inputs:
    node-version:
        type: string
        required: true
        description: 'Node.js version to use'
        default: '20'

runs:
    using: 'composite'
    steps:
        - name: Use non-Azure apt mirror
          if: runner.os == 'Linux'
          shell: bash
          # GitHub-hosted runners default to azure.archive.ubuntu.com, which
          # has had repeated DNS resolution failures. Switch to the canonical
          # archive.ubuntu.com mirror to avoid transient `apt-get` breakage
          # in steps like `playwright install --with-deps`.
          run: |
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "Skipping apt mirror rewrite because apt-get is unavailable."
                exit 0
              fi
              if [ -f /etc/apt/sources.list ]; then
                sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list
              fi
              if [ -d /etc/apt/sources.list.d ]; then
                sudo find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} +
              fi
              sudo apt-get update -o Acquire::Retries=3
        - name: Fetch trunk
          shell: bash
          run: git fetch origin trunk --depth=1 --recurse-submodules
        - uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
        - name: Cache node modules
          id: cache-nodemodules
          uses: actions/cache@v4
          env:
              cache-name: cache-node-modules-v2
          with:
              # caching node_modules
              path: node_modules
              key: ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-build-${{ env.cache-name }}-${{ hashFiles('package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-build-${{ env.cache-name }}-
                  ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-build-
                  ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-
        - name: Install Dependencies
          shell: bash
          if: steps.cache-nodemodules.outputs.cache-hit != 'true'
          run: npm ci
        - name: Set NX_BASE
          shell: bash
          run: echo "NX_BASE=$(git rev-parse origin/trunk)" >> $GITHUB_ENV
        - name: Set NX_HEAD
          shell: bash
          run: echo "NX_HEAD=$(git rev-parse HEAD)" >> $GITHUB_ENV
        - name: Reset NX cache
          shell: bash
          run: npx nx reset
