name: Clone the repository, install dependencies, and configures nx variables

inputs:
    node-version:
        type: string
        required: true
        description: 'Node.js version to use'
        default: '20'

runs:
    using: 'composite'
    steps:
        - name: Fetch base SHA for nx affected
          if: env.NX_BASE != ''
          shell: bash
          run: git fetch --no-tags --depth=1 --filter=blob:none origin "$NX_BASE"
        - uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
        - name: Cache node modules
          id: cache-nodemodules
          uses: actions/cache@v4
          env:
              cache-name: cache-node-modules-v3
          with:
              # caching node_modules
              path: |
                  node_modules
                  !node_modules/.vite
                  !node_modules/.vite/**
              key: ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-build-${{ env.cache-name }}-${{ hashFiles('package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-build-${{ env.cache-name }}-
                  ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-build-
                  ${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-
        - name: Install Dependencies
          shell: bash
          if: steps.cache-nodemodules.outputs.cache-hit != 'true'
          run: npm ci
        - name: Disable unrelated Microsoft apt feeds
          shell: bash
          run: |
              # Playwright's --with-deps runs apt-get update. The GitHub Ubuntu
              # runner includes Microsoft feeds for preinstalled tools that are
              # unrelated to browser dependencies. When those feeds serve a bad
              # InRelease file, apt exits 100 before reaching Ubuntu packages.
              sudo rm -f \
                  /etc/apt/sources.list.d/azure-cli.list \
                  /etc/apt/sources.list.d/azure-cli.sources \
                  /etc/apt/sources.list.d/microsoft-prod.list \
                  /etc/apt/sources.list.d/microsoft-prod.sources || true
        - name: Reset NX cache
          shell: bash
          run: npx nx reset
