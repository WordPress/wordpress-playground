name: Build Wasmtime platform packages

on:
    workflow_call:
        inputs:
            version:
                description: 'Version written to all six platform packages.'
                required: true
                type: string
            source-ref:
                description: 'Git commit or tag to build.'
                required: true
                type: string

permissions: {}

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: linux-x64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      exe: ''
                    - label: linux-arm64
                      os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                      exe: ''
                    - label: windows-x64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      exe: '.exe'
                    - label: windows-arm64
                      os: windows-11-arm
                      target: aarch64-pc-windows-msvc
                      exe: '.exe'
                    - label: macos-x64
                      os: macos-15-intel
                      target: x86_64-apple-darwin
                      exe: ''
                    - label: macos-arm64
                      os: macos-latest
                      target: aarch64-apple-darwin
                      exe: ''
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        permissions:
            contents: read
        name: 'build-wasmtime-platform-package (${{ matrix.label }})'

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.source-ref }}
                  submodules: true

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Install Rust components
              shell: bash
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
                  rustup target add ${{ matrix.target }}

            - name: Build and package native runtime
              shell: bash
              env:
                  WP_PLAYGROUND_NATIVE_PACKAGE_PRECOMPILE: '1'
                  WP_PLAYGROUND_NATIVE_TARGET_TRIPLE: ${{ matrix.target }}
                  WP_PLAYGROUND_NATIVE_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  source_commit="$(git rev-parse HEAD)"
                  native_output="$RUNNER_TEMP/wasmtime-native-package"
                  native_name="wp-playground-native-${{ inputs.version }}-${{ matrix.label }}"
                  npm_package_root="$RUNNER_TEMP/wasmtime-npm-package"
                  archive_root="dist/wasmtime-platform-packages/${{ matrix.label }}"

                  cargo build \
                    --manifest-path packages/playground/cli-native/Cargo.toml \
                    --release \
                    --bins \
                    --target ${{ matrix.target }}
                  WP_PLAYGROUND_NATIVE_SOURCE_COMMIT="$source_commit" \
                    cargo run \
                      --manifest-path packages/playground/cli-native/Cargo.toml \
                      --release \
                      --bin package-native-cli \
                      -- \
                      --binary "packages/playground/cli-native/target/${{ matrix.target }}/release/wp-playground-native${{ matrix.exe }}" \
                      --out-dir "$native_output" \
                      --name "$native_name" \
                      --skip-archive \
                      --precompile-wasmtime \
                      --smoke-wordpress-server \
                      --smoke-run-blueprint \
                      --smoke-build-snapshot

                  node packages/playground/cli-native/scripts/package-wasmtime-platform-for-self-hosting.mjs \
                    --label "${{ matrix.label }}" \
                    --source "$native_output/$native_name" \
                    --destination "$npm_package_root" \
                    --archive-directory "$archive_root" \
                    --version "${{ inputs.version }}"
                  npm_archive="$(npm pack --silent --pack-destination "$archive_root" "$npm_package_root")"
                  test -f "$archive_root/$npm_archive"

            - name: Upload npm package archive
              uses: actions/upload-artifact@v4
              with:
                  name: wasmtime-npm-package-${{ matrix.label }}
                  path: dist/wasmtime-platform-packages/${{ matrix.label }}/*.tgz
                  compression-level: 0
                  if-no-files-found: error

            - name: Upload self-hosted package archive
              uses: actions/upload-artifact@v4
              with:
                  name: wasmtime-self-hosted-package-${{ matrix.label }}
                  path: dist/wasmtime-platform-packages/${{ matrix.label }}/*.tar.gz
                  compression-level: 0
                  if-no-files-found: error
