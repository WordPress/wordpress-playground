name: Release NPM packages

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump (patch, minor, or major)'
                required: true
                default: 'patch'
            dist_tag:
                description: 'Dist tag (latest, next, etc.). Must be non-"latest" when publishing from a non-trunk branch.'
                required: false
                default: 'latest'
    schedule:
        # Auto-publish every Monday
        - cron: '0 9 * * 1'

permissions:
    id-token: write
    contents: write

concurrency:
    group: npm-release

jobs:
    release:
        # Only run on the playground repo, and only allow Playground maintainers to trigger this workflow.
        # Non-trunk branches are allowed but require a custom dist tag (not "latest").
        if: >
            github.repository == 'WordPress/wordpress-playground' &&
            (
              github.actor == 'adamziel' ||
              github.actor == 'dmsnell' ||
              github.actor == 'bgrgicak' ||
              github.actor == 'brandonpayton' ||
              github.actor == 'zaerl' ||
              github.actor == 'janjakes' ||
              github.actor == 'mho22' ||
              github.actor == 'ashfame'
            )

        runs-on: ubuntu-latest
        environment:
            name: npm

        steps:
            - name: Require custom dist tag for non-trunk branches
              if: github.ref != 'refs/heads/trunk' && (inputs.dist_tag == 'latest' || inputs.dist_tag == '')
              run: |
                  echo "::error::Publishing from a non-trunk branch requires a custom dist tag (not 'latest')."
                  echo "Please re-run this workflow and set the dist_tag input to something like 'next', 'canary', or 'beta'."
                  exit 1

            - name: Free up runner disk space
              run: |
                  set -euo pipefail
                  df -h
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /opt/hostedtoolcache/CodeQL
                  df -h

            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}
                  clean: true
                  persist-credentials: true
                  ssh-key: ${{ secrets.DEPLOY_KEY }}
                  submodules: true

            - name: Configure git
              run: |
                  git config --global user.name "deployment_bot"
                  git config --global user.email "deployment_bot@users.noreply.github.com"

            - name: Set up Node.js with OIDC
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            # npm 11.5.1+ is required for trusted publisher OIDC authentication
            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@latest lerna@9

            - uses: ./.github/actions/prepare-playground

            - name: Bump version (trunk)
              # Bump all package versions and create a local git commit + tag,
              # but do not push yet — the next step amends the commit to include
              # the recompile overrides reset so both land as one commit.
              if: github.ref == 'refs/heads/trunk'
              run: lerna version ${{ inputs.version_bump || 'patch' }} --yes --no-push

            - name: Delete recompile request and push (trunk)
              # Delete .recompile-request.json so download-wasm.mjs falls back
              # to each package's own package.json version (the new stable release).
              # Deleting avoids leaving stale entries and keeps the "no active
              # recompile" state unambiguous.
              if: github.ref == 'refs/heads/trunk'
              run: |
                  git rm --ignore-unmatch packages/php-wasm/.recompile-request.json
                  git commit --amend --no-edit
                  NEW_VERSION=$(node -e "console.log(require('./lerna.json').version)")
                  git tag -f "v${NEW_VERSION}"
                  git push origin trunk --follow-tags

            - name: Publish NPM packages (trunk)
              if: github.ref == 'refs/heads/trunk'
              run: >
                  lerna publish from-git
                  --yes --no-private --loglevel=verbose
                  --dist-tag=${{ inputs.dist_tag || 'latest' }}

            - name: Publish NPM packages (non-trunk)
              # On non-trunk branches no commit or tag is created — the version
              # bump only affects the published package.json on npm.
              if: github.ref != 'refs/heads/trunk'
              run: >
                  lerna publish ${{ inputs.version_bump || 'patch' }}
                  --yes --no-private --loglevel=verbose
                  --dist-tag=${{ inputs.dist_tag || 'latest' }}
                  --no-push --no-git-tag-version
