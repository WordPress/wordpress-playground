name: Repro admin View Transitions crash

on:
    workflow_dispatch:
    push:
        branches:
            - fix/chromium-admin-view-transitions-crash

jobs:
    repro:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true

            - uses: ./.github/actions/prepare-playground

            - name: Install Chrome for Playwright
              run: sudo npx playwright install chrome --with-deps

            - name: Start dev server
              run: |
                  npm run dev > /tmp/playground-dev.log 2>&1 &
                  timeout=120; elapsed=0
                  until curl -s -o /dev/null http://127.0.0.1:5400/website-server/ 2>/dev/null; do
                    sleep 3
                    elapsed=$((elapsed + 3))
                    if [ $elapsed -ge $timeout ]; then
                      echo "Dev server failed to start within ${timeout}s"
                      tail -100 /tmp/playground-dev.log
                      exit 1
                    fi
                  done

            - name: Compare admin View Transition behavior in headed Chrome under Xvfb
              run: |
                  mkdir -p /tmp/admin-view-transitions-repro
                  xvfb-run -a node <<'NODE'
                  const { chromium } = require('playwright');
                  const fs = require('fs');

                  const artifactDir = '/tmp/admin-view-transitions-repro';
                  const resultPath = `${artifactDir}/result.json`;
                  const launchOptions = {
                    channel: 'chrome',
                    headless: false,
                    args: [
                      '--window-size=1400,950',
                      '--enable-logging=stderr',
                      '--vmodule=*compositor*=2,*viz*=2,*view_transition*=2',
                    ],
                  };

                  async function runCase({ name, url }) {
                    const browser = await chromium.launch(launchOptions);
                    const page = await browser.newPage({
                      viewport: { width: 1400, height: 950 },
                    });
                    const events = [];
                    page.on('crash', () => events.push({ type: 'pagecrash' }));
                    page.on('pageerror', (error) =>
                      events.push({ type: 'pageerror', message: error.message })
                    );
                    page.on('console', (message) => {
                      if (['error', 'warning'].includes(message.type())) {
                        events.push({
                          type: `console:${message.type()}`,
                          message: message.text().slice(0, 500),
                        });
                      }
                    });

                    const result = {
                      name,
                      browserVersion: await browser.version(),
                      url,
                      beforeStyles: [],
                      foundThemesPage: null,
                      crashed: false,
                      closed: false,
                      events,
                    };

                    try {
                      await page.goto(result.url, {
                        waitUntil: 'domcontentloaded',
                        timeout: 120000,
                      });

                      let wp = null;
                      const deadline = Date.now() + 120000;
                      while (Date.now() < deadline && !wp) {
                        for (const frame of page.frames()) {
                          if (await frame.locator('#adminmenu').count().catch(() => 0)) {
                            wp = frame;
                            break;
                          }
                        }
                        if (!wp) {
                          await page.waitForTimeout(1000);
                        }
                      }
                      if (!wp) {
                        throw new Error('wp-admin frame with admin menu not found');
                      }

                      result.beforeStyles = await wp.evaluate(() =>
                        [...document.querySelectorAll('link[rel=stylesheet], style')]
                          .map((element) => ({
                            tag: element.tagName,
                            id: element.id || '',
                            href: element.getAttribute('href') || '',
                            text: element.textContent || '',
                          }))
                          .filter((entry) =>
                            /view-transition/i.test(entry.id + entry.href + entry.text)
                          )
                          .map((entry) => ({
                            ...entry,
                            text: entry.text.slice(0, 180),
                          }))
                      );
                      await page.screenshot({
                        path: `${artifactDir}/${name}-before-themes-click.png`,
                        fullPage: true,
                      });

                      await wp.getByRole('link', { name: 'Themes' }).first().evaluate(
                        (element) => element.click()
                      );
                      await page.waitForTimeout(15000).catch((error) => {
                        events.push({
                          type: 'wait-error',
                          message: error.message,
                        });
                      });

                      if (!page.isClosed()) {
                        for (const frame of page.frames()) {
                          const h1 = await frame
                            .locator('h1')
                            .first()
                            .textContent({ timeout: 250 })
                            .catch(() => null);
                          if (h1 && h1.includes('Themes')) {
                            result.foundThemesPage = {
                              url: frame.url(),
                              h1: h1.trim(),
                            };
                            await page.screenshot({
                              path: `${artifactDir}/${name}-after-themes-click.png`,
                              fullPage: true,
                            });
                            break;
                          }
                        }
                      }
                    } finally {
                      result.crashed = events.some(
                        (event) =>
                          event.type === 'pagecrash' || event.type === 'wait-error'
                      );
                      result.closed = page.isClosed();
                      console.log(JSON.stringify(result, null, 2));
                      await browser.close().catch(() => {});
                    }

                    return result;
                  }

                  (async () => {
                    const results = [];
                    results.push(
                      await runCase({
                        name: 'default',
                        url: 'http://127.0.0.1:5400/website-server/?storage=temp&url=/wp-admin/',
                      })
                    );
                    results.push(
                      await runCase({
                        name: 'with-admin-transitions',
                        url: 'http://127.0.0.1:5400/website-server/?with-admin-transitions&storage=temp&url=/wp-admin/',
                      })
                    );
                    fs.writeFileSync(resultPath, JSON.stringify(results, null, 2));

                    const [defaultResult, overrideResult] = results;
                    if (defaultResult.beforeStyles.length) {
                      throw new Error('Expected default run to disable admin View Transition styles');
                    }
                    if (defaultResult.crashed || !defaultResult.foundThemesPage) {
                      throw new Error('Expected default run to load Themes without crashing');
                    }
                    if (!overrideResult.beforeStyles.length) {
                      throw new Error('Expected override run to keep admin View Transition styles');
                    }
                    if (!overrideResult.crashed) {
                      throw new Error('Expected override run to crash Chrome');
                    }
                  })().catch((error) => {
                    console.error(error);
                    process.exit(1);
                  });
                  NODE

            - name: Upload repro artifacts
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: admin-view-transitions-crash-repro
                  path: |
                      /tmp/admin-view-transitions-repro/
                      /tmp/playground-dev.log
                  if-no-files-found: ignore
