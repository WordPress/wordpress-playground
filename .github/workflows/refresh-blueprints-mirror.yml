name: Refresh Blueprints mirror

# playground.wordpress.net serves its own copy of the WordPress/blueprints
# repository under /blueprints/ so that booting Playground does not depend on
# GitHub being available. The copy is built into every website deployment;
# this workflow refreshes just the copy in between deployments.

on:
    workflow_dispatch:
    # Refresh daily. The full website deploy on Tuesdays ships the mirror too.
    schedule:
        - cron: '0 5 * * *'

concurrency:
    group: blueprints-mirror-deployment

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    # Check preconditions in a separate job because secrets aren't
    # available in job-level `if` conditions.
    check_preconditions:
        # Only run from the trunk branch when triggered by a schedule OR a Playground maintainer
        if: >
            github.ref == 'refs/heads/trunk' && (
                github.event_name == 'schedule' ||
                github.actor == 'adamziel' ||
                github.actor == 'akirk' ||
                github.actor == 'dmsnell' ||
                github.actor == 'bgrgicak' ||
                github.actor == 'brandonpayton' ||
                github.actor == 'zaerl' ||
                github.actor == 'janjakes' ||
                github.actor == 'mho22' ||
                github.actor == 'ashfame'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions: {}
        environment:
            name: playground-wordpress-net-wp-cloud
        outputs:
            meets_deploy_preconditions: ${{ steps.check.outputs.meets_deploy_preconditions }}
        steps:
            - name: Check deploy secrets are configured
              id: check
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }}
              run: |
                  if [ -z "$DEPLOY_HOST" ]; then
                    echo "Deploy secrets are not configured. Skipping deployment."
                    echo "meets_deploy_preconditions=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "meets_deploy_preconditions=true" >> "$GITHUB_OUTPUT"
                  fi

    refresh:
        needs: check_preconditions
        if: needs.check_preconditions.outputs.meets_deploy_preconditions == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        environment:
            name: playground-wordpress-net-wp-cloud
        steps:
            - uses: actions/checkout@v5
              with:
                  # The sync script has no dependencies, so a bare checkout is enough.
                  sparse-checkout: |
                      packages/playground/website/scripts
                      packages/playground/website-deployment
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Mirror the Blueprints directory
              run: node packages/playground/website/scripts/sync-blueprints-mirror.mjs

            - name: Deploy Blueprints mirror
              shell: bash
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_WEBSITE_TARGET_HOST_KEY }}" >> ~/.ssh/known_hosts
                  echo "${{ secrets.DEPLOY_WEBSITE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  chmod 0600 ~/.ssh/*

                  rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --delete \
                    packages/playground/website/public/blueprints/ \
                    ${{ secrets.DEPLOY_WEBSITE_TARGET_USER }}@${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }}:'~/updated-blueprints-mirror'

                  rsync -avz -e "ssh -i ~/.ssh/id_ed25519" \
                    packages/playground/website-deployment/apply-blueprints-mirror-update.sh \
                    ${{ secrets.DEPLOY_WEBSITE_TARGET_USER }}@${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }}:'~/website-deployment/'

                  ssh -i ~/.ssh/id_ed25519 \
                    ${{ secrets.DEPLOY_WEBSITE_TARGET_USER }}@${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }} \
                    -tt -C '~/website-deployment/apply-blueprints-mirror-update.sh'
