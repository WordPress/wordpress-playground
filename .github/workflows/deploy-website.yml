name: Deploy Playground website

on:
    workflow_dispatch:
    # Deploy the website every Tuesday at 11am UTC
    schedule:
        - cron: '0 11 * * 2'

concurrency:
    group: website-deployment

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    # Check preconditions in a separate job because secrets aren't
    # available in job-level `if` conditions.
    check_preconditions:
        # Only run from the trunk branch when triggered by another workflow OR a Playground maintainer
        if: >
            github.ref == 'refs/heads/trunk' && (
                github.event_name == 'workflow_run' ||
                (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]') ||
                github.actor == 'adamziel' ||
                github.actor == 'akirk' ||
                github.actor == 'dmsnell' ||
                github.actor == 'bgrgicak' ||
                github.actor == 'brandonpayton' ||
                github.actor == 'zaerl' ||
                github.actor == 'janjakes' ||
                github.actor == 'mho22' ||
                github.actor == 'ashfame'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions: {}
        environment:
            name: playground-wordpress-net-wp-cloud
        outputs:
            meets_deploy_preconditions: ${{ steps.check.outputs.meets_deploy_preconditions }}
        steps:
            # Confirm deploy secrets are configured. This way, this workflow won't
            # run on a repo fork by default. It will only run when the fork admin opts
            # in by configuring the workflow's required secrets.
            #
            # Secrets aren't available in job-level `if` conditions,
            # so we check for them here.
            - name: Check deploy secrets are configured
              id: check
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }}
              run: |
                  if [ -z "$DEPLOY_HOST" ]; then
                    echo "Deploy secrets are not configured. Skipping deployment."
                    echo "meets_deploy_preconditions=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "meets_deploy_preconditions=true" >> "$GITHUB_OUTPUT"
                  fi

    build_and_deploy:
        needs: check_preconditions
        if: needs.check_preconditions.outputs.meets_deploy_preconditions == 'true'

        # Specify runner + deployment step
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read # Required to clone the repo.
        environment:
            name: playground-wordpress-net-wp-cloud
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: true
                  # Allow deploying a specific ref for folks who want to pin a specific version.
                  ref: ${{ vars.GIT_REF_TO_DEPLOY }}
            - uses: ./.github/actions/prepare-playground
              with:
                  # The kandelo binary fetch script needs Node >= 22.18;
                  # 24 matches the posix-kernel CI jobs.
                  node-version: 24
            - name: Sync PHP next build assets
              run: npm run sync:php-next
            # host/dist/ and binaries/ are gitignored upstream; build and
            # fetch them so the kernel-mode remote build finds its
            # artifacts. Mirrors the posix-kernel jobs in ci.yml.
            - name: Build kandelo host
              shell: bash
              working-directory: kandelo/host
              run: |
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
                  npm run build
            - name: Fetch kandelo wasm binaries
              run: node packages/playground/cli/src/posix-kernel/scripts/fetch-kandelo-binaries.mts
            # Built before the website so `build:wasm-wordpress-net`
            # packages the kernel-mode remote into the artifact.
            - name: Build the kernel-mode remote
              run: npx nx run playground-remote:build-experimental-posix-kernel
              env:
                  CORS_PROXY_URL: ${{ vars.CORS_PROXY_URL }}
            - run: npx nx build playground-website
              env:
                  CORS_PROXY_URL: ${{ vars.CORS_PROXY_URL }}
                  VITE_GOOGLE_ANALYTICS_ID: G-SVTNFCP8T7
            - run: tar -czf wasm-wordpress-net.tar.gz dist/packages/playground/wasm-wordpress-net
            # Store dist/packages/artifacts/wasm-wordpress-net as a build artifact
            - uses: actions/upload-artifact@v4
              with:
                  name: playground-website
                  path: wasm-wordpress-net.tar.gz
            # The artifact only becomes available after this workflow wraps up, so let's wrap.
            # This artifact enables the download of a pre-built package and hosting of one's own playground instance.

            - name: Deploy Playground website build
              shell: bash
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_WEBSITE_TARGET_HOST_KEY }}" >> ~/.ssh/known_hosts
                  echo "${{ secrets.DEPLOY_WEBSITE_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  chmod 0600 ~/.ssh/*

                  # Website files
                  rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --delete \
                    dist/packages/playground/wasm-wordpress-net/ \
                    ${{ secrets.DEPLOY_WEBSITE_TARGET_USER }}@${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }}:'~/updated-playground-files'

                  # Include MIME types for use with PHP-served files
                  cp packages/php-wasm/universal/src/lib/mime-types.json \
                    packages/playground/website-deployment/

                  # Host-specific deployment scripts and server config
                  rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --delete \
                    packages/playground/website-deployment/ \
                    ${{ secrets.DEPLOY_WEBSITE_TARGET_USER }}@${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }}:'~/website-deployment'

                  # Apply update
                  ssh -i ~/.ssh/id_ed25519 \
                    ${{ secrets.DEPLOY_WEBSITE_TARGET_USER }}@${{ secrets.DEPLOY_WEBSITE_TARGET_HOST }} \
                    -tt -C '~/website-deployment/apply-update.sh'
