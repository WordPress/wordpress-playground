name: Close stale draft pull requests

on:
    schedule:
        - cron: '0 7 * * *'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Report actions without posting comments or closing PRs'
                type: boolean
                default: false

concurrency:
    group: stale-draft-prs

permissions: {}

jobs:
    process:
        if: github.repository == 'WordPress/wordpress-playground'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.STALE_DRAFT_PRS_SLACK_WEBHOOK }}
        permissions:
            pull-requests: write
        steps:
            - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              id: stale-drafts
              env:
                  DRY_RUN: ${{ inputs.dry_run }}
              with:
                  script: |
                      const WARN_DAYS = 30;
                      const GRACE_DAYS = 7;
                      const DAY_MS = 24 * 60 * 60 * 1000;
                      const WARN_MARKER = '<!-- stale-draft-bot:warned';
                      const BOT_LOGIN = 'github-actions[bot]';
                      const now = Date.now();
                      const SLACK_SECTION_LIMIT = 20;
                      const ACTIVITY_EVENTS = [
                          'committed',
                          'head_ref_force_pushed',
                          'commented',
                          'reviewed',
                          'reopened',
                          'ready_for_review',
                          'convert_to_draft',
                      ];
                      const DRY_RUN = process.env.DRY_RUN === 'true';
                      const DRY_RUN_NOTICE = 'Dry run: no comment was posted and no pull request was closed.';

                      const warnBody = (pr) =>
                          [
                              `${WARN_MARKER} ${pr.head.sha} -->`,
                              'This draft pull request has had no commits or comments in the last 30 days.',
                              '',
                              'If it is still active, please push a commit, leave a comment, or mark it ready for review. Otherwise it will be automatically closed after 7 more days of inactivity.',
                          ].join('\n');

                      const CLOSE_BODY = [
                          'Closing this draft pull request because it has received no activity in the 7 days since the warning above.',
                          '',
                          'No worries — feel free to reopen it any time if you would like to continue the work.',
                      ].join('\n');

                      const isOwnWarning = (event) =>
                          event.event === 'commented' &&
                          event.user?.login === BOT_LOGIN &&
                          event.body?.includes(WARN_MARKER);

                      const isHumanActivity = (event) =>
                          ACTIVITY_EVENTS.includes(event.event) &&
                          (event.actor ?? event.user)?.type !== 'Bot';

                      const timeOf = (date) => new Date(date).getTime();

                      const eventTime = (event) =>
                          timeOf(event.created_at ?? event.submitted_at ?? event.committer.date);

                      const daysSince = (time) => Math.floor((now - time) / DAY_MS);

                      const escapeMarkdown = (value) =>
                          value
                              .replaceAll('&', '&amp;')
                              .replaceAll('\\', '\\\\')
                              .replaceAll('|', '\\|')
                              .replaceAll('[', '\\[')
                              .replaceAll(']', '\\]')
                              .replaceAll('<', '&lt;')
                              .replaceAll('>', '&gt;');

                      const escapeSlack = (value) =>
                          value
                              .replaceAll('&', '&amp;')
                              .replaceAll('<', '&lt;')
                              .replaceAll('>', '&gt;');

                      const prSummaryLink = (pr) =>
                          `[#${pr.number}](${pr.html_url}) ${escapeMarkdown(pr.title)}`;

                      const prSlackLink = (pr) =>
                          `<${pr.html_url}|#${pr.number}> ${escapeSlack(pr.title)}`;

                      const report = (pr, reason) => ({
                          summary: [prSummaryLink(pr), reason],
                          slack: `- ${prSlackLink(pr)} - ${escapeSlack(reason)}`,
                      });

                      const warnedPrs = [];
                      const gracePrs = [];
                      const closedPrs = [];
                      const failedPrs = [];

                      const addSummaryTable = (title, rows) => {
                          core.summary.addRaw(`### ${title}\n\n`);

                          if (rows.length === 0) {
                              core.summary.addRaw('None\n\n');
                              return;
                          }

                          core.summary.addRaw('| Pull request | Reason |\n');
                          core.summary.addRaw('| --- | --- |\n');
                          for (const [pullRequest, reason] of rows) {
                              core.summary.addRaw(
                                  `| ${pullRequest} | ${escapeMarkdown(reason)} |\n`
                              );
                          }
                          core.summary.addRaw('\n');
                      };

                      const slackSection = (title, rows, runUrl) => {
                          if (rows.length === 0) {
                              return [`*${title}:*`, 'None'].join('\n');
                          }

                          const visibleRows = rows.slice(0, SLACK_SECTION_LIMIT);
                          const hiddenRows = rows.length - visibleRows.length;
                          const suffix =
                              hiddenRows > 0
                                  ? `\n...and ${hiddenRows} more. See the Actions summary: ${runUrl}`
                                  : '';

                          return [`*${title}:*`, `${visibleRows.join('\n')}${suffix}`].join('\n');
                      };

                      const { owner, repo } = context.repo;

                      const prs = await github.paginate(github.rest.pulls.list, {
                          owner, repo, state: 'open', per_page: 100,
                      });
                      const drafts = prs.filter((pr) => pr.draft === true);
                      const runUrl =
                          `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

                      const processDraft = async (pr) => {
                          const issue = { owner, repo, issue_number: pr.number };
                          const pull = { owner, repo, pull_number: pr.number };

                          const timeline = await github.paginate(
                              github.rest.issues.listEventsForTimeline,
                              { ...issue, per_page: 100 }
                          );

                          const lastWarning = timeline.filter(isOwnWarning).at(-1);
                          const lastWarningTime = lastWarning ? timeOf(lastWarning.created_at) : 0;
                          const headChangedSinceWarning =
                              lastWarning && !lastWarning.body.includes(pr.head.sha);
                          const lastActivity = Math.max(
                              timeOf(pr.created_at),
                              headChangedSinceWarning ? lastWarningTime : 0,
                              ...timeline.filter(isHumanActivity).map(eventTime)
                          );
                          const hasActiveWarning = lastWarningTime > lastActivity;

                          if (!hasActiveWarning) {
                              const daysIdle = daysSince(lastActivity);
                              if (daysIdle < WARN_DAYS) {
                                  return;
                              }
                              if (!DRY_RUN) {
                                  await github.rest.issues.createComment({ ...issue, body: warnBody(pr) });
                              }
                              warnedPrs.push(report(pr, `${daysIdle} days since last activity`));
                              return;
                          }

                          const warningAgeDays = daysSince(lastWarningTime);
                          const reason = `${warningAgeDays} days since warning`;

                          if (warningAgeDays < GRACE_DAYS) {
                              gracePrs.push(report(pr, reason));
                              return;
                          }
                          if (!DRY_RUN) {
                              await github.rest.pulls.update({ ...pull, state: 'closed' });
                          }
                          closedPrs.push(report(pr, reason));
                          if (DRY_RUN) {
                              return;
                          }
                          await github.rest.issues.createComment({ ...issue, body: CLOSE_BODY });
                      };

                      for (const pr of drafts) {
                          try {
                              await processDraft(pr);
                          } catch (error) {
                              failedPrs.push(report(pr, error.message.replace(/[\r\n]+/g, ' ')));
                          }
                      }

                      core.summary
                          .addHeading('Stale draft pull requests')
                          .addRaw(`Checked ${drafts.length} open draft pull requests.\n\n`);

                      if (DRY_RUN) {
                          core.summary.addRaw(`${DRY_RUN_NOTICE}\n\n`);
                      }

                      addSummaryTable('Warnings posted', warnedPrs.map((pr) => pr.summary));
                      addSummaryTable(
                          'Already warned, still in grace period',
                          gracePrs.map((pr) => pr.summary)
                      );
                      addSummaryTable('Closed', closedPrs.map((pr) => pr.summary));
                      addSummaryTable('Failed', failedPrs.map((pr) => pr.summary));

                      await core.summary.write();

                      const reportedPrs = [...warnedPrs, ...gracePrs, ...closedPrs, ...failedPrs];

                      if (reportedPrs.length === 0) {
                          return;
                      }

                      const slackText = [
                          '*Stale draft pull requests report*',
                          ...(DRY_RUN ? [DRY_RUN_NOTICE] : []),
                          `Checked ${drafts.length} open draft pull requests.`,
                          `Full report: ${runUrl}`,
                          '',
                          slackSection(
                              'Warnings posted',
                              warnedPrs.map((pr) => pr.slack),
                              runUrl
                          ),
                          '',
                          slackSection(
                              'Already warned, still in grace period',
                              gracePrs.map((pr) => pr.slack),
                              runUrl
                          ),
                          '',
                          slackSection('Closed', closedPrs.map((pr) => pr.slack), runUrl),
                          '',
                          slackSection('Failed', failedPrs.map((pr) => pr.slack), runUrl),
                      ].join('\n');

                      core.setOutput('slack-message', JSON.stringify({ text: slackText }));

                      if (failedPrs.length > 0) {
                          core.setFailed(`${failedPrs.length} draft pull requests failed.`);
                      }

            - name: Send Slack report
              if: ${{ !cancelled() && env.SLACK_WEBHOOK_URL != '' && steps.stale-drafts.outputs.slack-message != '' }}
              env:
                  SLACK_MESSAGE: ${{ steps.stale-drafts.outputs.slack-message }}
              run: |
                  curl --fail --show-error --silent --max-time 30 \
                      -H 'Content-type: application/json' \
                      --data "$SLACK_MESSAGE" \
                      "$SLACK_WEBHOOK_URL" ||
                      echo "::warning::Slack notification failed; stale draft processing already completed."
